x-takbuilds: &takbuildinfo  # Remember to change the TAK_RELEASE tag in CI jobs as well
  image: "${PVARKI_DOCKER_REPO:-ghcr.io/}pvarki/takserver:${TAK_RELEASE:-5.8-RELEASE-69}${DOCKER_TAG_EXTRA:-}"
  build:
    context: .
    dockerfile: Dockerfile
    args:
        TAK_RELEASE: ${TAK_RELEASE:-5.8-RELEASE-69}

services:

  takserver_initialization:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
    networks:
      - taknet
    volumes:
      - takserver_data:/opt/tak/data
    command: /opt/scripts/firstrun.sh

  takserver_config:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takserver_initialization:
          condition: service_completed_successfully
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      taknet:
        aliases: [takconfig-ignite]
    environment:
      TAK_IGNITE_BIND_ADDRESS: takconfig-ignite
    command: ./opt/scripts/start-tak.sh config
    healthcheck: &takhealth
      test: [CMD, /usr/bin/python3, /opt/scripts/healthcheck.py, config]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 180s

  takserver_messaging:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_config:
        # Messaging is the Ignite server; config cannot become ready without it.
        condition: service_started
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      taknet:
        aliases: [takmsg-ignite]
    environment:
      TAK_IGNITE_BIND_ADDRESS: takmsg-ignite
    ports:
      - '8089:8089'
      - '8090:8090'
      - '9001:9001'
      - '9002:9002'
    command: ./opt/scripts/start-tak.sh messaging
    healthcheck:
      <<: *takhealth
      test: [CMD, /usr/bin/python3, /opt/scripts/healthcheck.py, messaging]

  takserver_api:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_messaging:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      taknet:
        aliases: [takapi-ignite]
    environment:
      TAK_IGNITE_BIND_ADDRESS: takapi-ignite
    ports:
      - '8443:8443'
    command: ./opt/scripts/start-tak.sh api
    healthcheck:
      <<: *takhealth
      test: [CMD, /usr/bin/python3, /opt/scripts/healthcheck.py, api]

  takserver_retention:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_messaging:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      taknet:
        aliases: [takreten-ignite]
    environment:
      TAK_IGNITE_BIND_ADDRESS: takreten-ignite
    command: ./opt/scripts/start-tak.sh retention
    healthcheck:
      <<: *takhealth
      test: [CMD, /usr/bin/python3, /opt/scripts/healthcheck.py, retention]

  takserver_pluginmanager:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_api:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      taknet:
        aliases: [takplug-ignite]
    environment:
      TAK_IGNITE_BIND_ADDRESS: takplug-ignite
    command: ./opt/scripts/start-tak.sh pm
    healthcheck:
      <<: *takhealth
      test: [CMD, /usr/bin/python3, /opt/scripts/healthcheck.py, pm]

  takdb:
    image: postgis/postgis:15-3.3
    networks:
      - taknet
    env_file:
      - 'takserver.env'
    volumes:
      - 'takdb_data:/var/lib/postgresql/data'
    healthcheck:
      test: "pg_isready --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  taknet:

volumes:
  takdb_data:
    driver: local
  takserver_data:
    driver: local
