[project]
name = "takserver-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lxml>=6.1.3,<7"]

[dependency-groups]
dev = ["ruff==0.16.7", "pyrefly==1.3.0", "types-lxml==2026.2.16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[tool.pyrefly]
preset = "default"
project-includes = ["scripts/**/*.py", "tests/**/*.py"]
search-path = ["scripts", "tests"]
python-version = "3.12"
python-platform = "linux"
